name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          if [ -f SilentStory.zip ]; then
            unzip -q -o SilentStory.zip
            echo "PROJECT=SilentStory" >> "$GITHUB_ENV"
          else
            echo "PROJECT=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: silent-story-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk

name: Build BlindView APK

on:
  push:
    branches: [ blindview ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BlindView.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlindView-apk
          path: BlindView.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete blindview-latest --yes --cleanup-tag || true
          gh release create blindview-latest BlindView.apk --target "${{ github.sha }}" --title "BlindView (build ${{ github.run_number }})" --notes "Latest BlindView build" --latest=false
